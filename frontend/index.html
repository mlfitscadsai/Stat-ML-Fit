<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    try {
      if (localStorage.getItem('isDark') === 'true') {
        document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    } catch (e) {}
  </script>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favico.png">
  <title>
    Machine Learning Tool Kit
  </title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.datatables.net" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://cdn.datatables.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.datatables.net/v/bm/dt-1.13.8/r-2.5.0/sb-1.6.0/datatables.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/buefy/3.0.3/css/buefy.min.css"
    integrity="sha512-NXTOU8SrCwbw6zONSSMwhe1cPRO8bFcd6wHUIoqqt28/vozOWf20L85BRmMF/ZdGdsQFt1oMXrI1+5hjFog+bQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js" fetchpriority="high"></script>

  <script id="MathJax-script" async defer fetchpriority="low" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script type="module">
    window.addEventListener('load', async () => {
      try {
        const baseUrl = new URL('/webr/dist/', window.location.href).href;
        const swUrl = new URL('/webr/', window.location.href).href;
        const { WebR } = await import(new URL('webr.mjs', baseUrl).href);
        const webR = new WebR({
          baseUrl,
          serviceWorkerUrl: swUrl,
          interactive: false,
        });
        await webR.init();
        window.webr = webR;
      } catch (err) {
        console.warn('WebR init failed (in-browser R features disabled):', err);
      }
    });
  </script>
</body>
</html>
