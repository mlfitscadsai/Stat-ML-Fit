# Stat-ML-Fit — nginx: static SPA + /api → Docker Flask (127.0.0.1:5001)
# Install: sudo bash scripts/install-nginx-config.sh

server {
    listen 80;
    listen [::]:80;
    server_name mlfit.com www.mlfit.com stat-ml-fit.scads.ai www.stat-ml-fit.scads.ai;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stat-ml-fit.scads.ai www.stat-ml-fit.scads.ai;

    ssl_certificate /etc/letsencrypt/live/stat-ml-fit.scads.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat-ml-fit.scads.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/stat-ml-fit/frontend/dist;
    index index.html;

    access_log /var/log/nginx/stat-ml-fit.access.log;
    error_log /var/log/nginx/stat-ml-fit.error.log;

    client_max_body_size 128m;

    # webR / onnx wasm — do not gzip (breaks Emscripten fetch + Content-Encoding)
    location ~* \.(wasm|mjs|data)$ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /webr/ {
        gzip off;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
